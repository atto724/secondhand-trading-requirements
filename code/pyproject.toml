[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "secondhand-trading-desktop"
version = "0.3.0"
description = "UML-based secondhand trading desktop application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<14"]

[project.optional-dependencies]
dev = ["pylint==4.1.3", "black==26.10.1", "build==1.6.1", "setuptools>=77"]

[project.scripts]
secondhand-trading = "main:main"
secondhand-demo = "demo:main"
secondhand-manage = "manage:main"

[tool.setuptools]
packages = ["demo_assets"]
py-modules = ["accounts", "admin_ui", "catalog", "community", "core", "database", "demo", "domain", "editor_ui", "governance", "images", "main", "manage", "market_ui", "message_ui", "operations", "products", "products_ui", "registration_ui", "schema", "seller_ui", "security", "trades", "trades_ui", "ui_common", "ui_runtime", "benchmark"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pylint.main]
ignore = [".venv", "data", "build", "dist", "tests", "__pycache__"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
# Tkinter widget inheritance and form constructors naturally exceed generic limits.
max-parents = 10
max-attributes = 20
max-args = 12
max-positional-arguments = 12
max-locals = 30
max-statements = 90
max-branches = 16

[tool.pylint.messages_control]
# Broad catches are limited to transaction cleanup, notification isolation and UI boundaries.
disable = ["broad-exception-caught", "implicit-str-concat", "duplicate-code"]

[tool.isort]
profile = "black"
line_length = 100
known_third_party = ["PIL"]

[tool.setuptools.package-data]
demo_assets = ["*.jpg", "README.md"]
